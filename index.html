<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4CAF50">
  <title>MyWeight Coach</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div class="container">
    <!-- En-tête de l'application -->
    <header>
      <h1>MyWeight Coach</h1>
      <p>Votre coach nutritionnel personnel</p>
    </header>

    <!-- Section du chat IA -->
    <section class="section">
      <h2>Mon Coach Nutritionnel</h2>
      <div id="chat-container">
        <div id="chat-messages"></div>
        <div id="chat-input-container">
          <input type="text" id="user-input" placeholder="Parlez à votre coach..." autocomplete="off" />
          <button id="send-button">Envoyer</button>
          <button id="voice-button" title="Reconnaissance vocale">🎤</button>
        </div>
        <div id="chat-actions"></div>
      </div>
    </section>

    <!-- Section des repas -->
    <section class="section">
      <h2>Mes Repas</h2>
      <ul id="meals-list" class="list"></ul>
    </section>

    <!-- Section des recettes -->
    <section class="section">
      <h2>Mes Recettes</h2>
      <ul id="recipes-list" class="list"></ul>
    </section>

    <!-- Section des pesées -->
    <section class="section">
      <h2>Mes Pesées</h2>
      <ul id="weights-list" class="list"></ul>
    </section>

    <!-- Section de sauvegarde -->
    <section class="section">
      <h2>Sauvegarde des données</h2>
      <div>
        <button id="export-button">Exporter les données</button>
        <button id="import-button">Importer les données</button>
        <input type="file" id="import-file" accept=".json" style="display: none;" />
      </div>
    </section>
  </div>

  <script src="src/main.js"></script>
</body>
</html>
